schema_version: 1

# ============================================================
# SERIAL COMMUNICATION
# ============================================================
serial:
  port: /dev/ttyUSB0
  baud_rate: 9600
  percept_poll_period: 0.5
  serial_read_period: 0.05
  percept_request: getPercepts

interfaces:

  # ============================================================
  # RED LED
  # ============================================================
  - name: red_led
    kind: boolean_actuator

    command:
      topic: /arduino/red_led/command
      ros_type: std_msgs/msg/Bool

      actions:
        "true": ledRedOn
        "false": ledRedOff

    status:
      topic: /arduino/red_led/status
      ros_type: std_msgs/msg/Bool

      percept:
        name: red
        argument: 0

      values:
        "on": true
        "off": false


  # ============================================================
  # BLUE LED
  # ============================================================
  - name: blue_led
    kind: boolean_actuator

    command:
      topic: /arduino/blue_led/command
      ros_type: std_msgs/msg/Bool

      actions:
        "true": ledBlueOn
        "false": ledBlueOff

    status:
      topic: /arduino/blue_led/status
      ros_type: std_msgs/msg/Bool

      percept:
        name: blue
        argument: 0

      values:
        "on": true
        "off": false
        
  # ============================================================
  # RGB LED
  # ============================================================
  - name: rgb_led
    kind: discrete_actuator

    command:
      topic: /arduino/rgb_led/command
      ros_type: std_msgs/msg/String

      actions:
        white: rgbWhite
        green: rgbGreen
        blue: rgbBlue
        red: rgbRed
        off: rgbOff
    status:
      topic: /arduino/rgb_led/status
      ros_type: std_msgs/msg/String

      percept:
        name: rgb
        argument: 0

      values:
        red: red
        green: green
        blue: blue
        white: white
        off: off
        
  # ============================================================
  # BUZZER
  # ============================================================
  - name: buzzer
    kind: boolean_actuator

    command:
      topic: /arduino/buzzer/command
      ros_type: std_msgs/msg/Bool

      actions:
        "true": buzzerOn
        "false": buzzerOff

    status:
      topic: /arduino/buzzer/status
      ros_type: std_msgs/msg/Bool

      percept:
        name: buzzer
        argument: 0

      values:
        "on": true
        "off": false  

  # ============================================================
  # BUTTON 1
  # ============================================================
  - name: button1
    kind: discrete_actuator

    command:
      topic: /system1
      ros_type: std_msgs/msg/String

      actions:
        alert: alertOn
        right: flashROn
        left: flashLOn
        "off": flashLightOff

    status:
      topic: /arduino/button1/status
      ros_type: std_msgs/msg/String

      percept:
        name: button1
        argument: 0

      values:
        pressed: pressed
        released: released

        
  # ============================================================
  # BUTTON 2
  # ============================================================
  - name: button2
    kind: discrete_actuator

    command:
      topic: /system2
      ros_type: std_msgs/msg/String

      actions:
        alert: alertOn
        right: flashROn
        left: flashLOn
        "off": flashLightOff

    status:
      topic: /arduino/button2/status
      ros_type: std_msgs/msg/String

      percept:
        name: button2
        argument: 0

      values:
        pressed: pressed
        released: released 
        
  # ============================================================
  # TEMPERATURE SENSOR
  # ============================================================
  - name: temperature
    kind: scalar_sensor

    status:
      topic: /arduino/temperature_sensor
      ros_type: std_msgs/msg/Float32

      percept:
        name: temp
        argument: 0

      conversion:
        scale: 1.0
        offset: 0.0
        minimum: 0.0
        maximum: 1023.0      
  
  # ============================================================
  # HUMIDITY SENSOR
  # ============================================================
  - name: humidity
    kind: scalar_sensor

    status:
      topic: /arduino/humidity_sensor
      ros_type: std_msgs/msg/Float32

      percept:
        name: hum
        argument: 0

      conversion:
        scale: 1.0
        offset: 0.0
        minimum: 0.0
        maximum: 1023.0     
        
  # ============================================================
  # LUMINOSITY SENSOR
  # ============================================================
  - name: luminosity
    kind: scalar_sensor

    status:
      topic: /arduino/luminosity_sensor
      ros_type: std_msgs/msg/Float32

      percept:
        name: lum
        argument: 0

      conversion:
        scale: 1.0
        offset: 0.0
        minimum: 0.0
        maximum: 1023.0                    
        
        
  # ============================================================
  # POTENTIOMETER
  # ============================================================
  - name: potentiometer
    kind: scalar_sensor

    status:
      topic: /arduino/potentiometer
      ros_type: std_msgs/msg/Float32

      percept:
        name: pot
        argument: 0

      conversion:
        scale: 1.0
        offset: 0.0
        minimum: 0.0
        maximum: 1023.0                    
                        
                                       
                
               
        
        
  
